<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SIE Prep">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>SIE Practice</title>
<style>
:root{--bg:#0f1720;--card:#18222e;--line:#2a3746;--text:#e8edf2;--mute:#93a1b0;--acc:#4fb3a9;--ok:#3fae6a;--bad:#d9534f;--flag:#e0a63a}
@media (prefers-color-scheme: light){:root{--bg:#f4f1ea;--card:#ffffff;--line:#ddd6c8;--text:#1d232a;--mute:#69717a;--acc:#1f7a71;--ok:#2b8a52;--bad:#b9302c;--flag:#b57a12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:26px;margin:12px 0 2px;letter-spacing:-.01em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:26px 0 10px;font-weight:600}
.sub{color:var(--mute);margin:0 0 8px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
button{font:inherit;color:inherit}
.btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;cursor:pointer}
.btn b{display:block;font-size:17px}
a.btn{text-decoration:none;color:inherit}
.btn span{color:var(--mute);font-size:14px}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary span{color:rgba(255,255,255,.85)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pill{display:inline-block;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.top{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:14px}
.top .row{align-items:center}
.top .l{font-size:14px;color:var(--mute)}
.top .r{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.q{font-size:19px;line-height:1.4;margin:6px 0 16px}
.ch{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:0 0 10px;cursor:pointer;display:flex;gap:12px}
.ch .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--mute)}
.ch.sel{border-color:var(--acc)} .ch.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.ch.ok{border-color:var(--ok)} .ch.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.bad{border-color:var(--bad)} .ch.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.exp{border-left:3px solid var(--acc);padding:8px 12px;margin:6px 0 12px;background:var(--card);border-radius:0 10px 10px 0}
.exp b.ok{color:var(--ok)} .exp b.bad{color:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.nav button.go{background:var(--acc);border-color:var(--acc);color:#fff}
.nav button.fl{flex:0 0 56px}
.nav button.fl.on{color:var(--flag);border-color:var(--flag)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;padding:0}
.grid .done{background:var(--line)} .grid .flag{border-color:var(--flag);color:var(--flag)} .grid .cur{outline:2px solid var(--acc)}
.grid .ok{background:var(--ok);color:#fff;border-color:var(--ok)} .grid .bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.big{font-size:54px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.sec{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sec:last-child{border:0}
.link{background:none;border:0;color:var(--acc);padding:6px 0;cursor:pointer;font-size:15px}
.meta{font-size:13px;color:var(--mute)}
.hide{display:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 6px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.ch.sel .k{background:var(--acc)}
.nav button:disabled{opacity:.4}
</style>
</head>
<body>
<div class="wrap" id="app"><h1>SIE Practice</h1><p class="sub">Loading…</p></div>
<div class="nav hide" id="nav"><div class="in" id="navin"></div></div>
<script>
window.onerror = function (msg, src, line) {
  var a = document.getElementById('app');
  if (a) a.innerHTML = '<h1>SIE Practice</h1><div class="card"><b>Something went wrong.</b><p class="meta">' + String(msg).replace(/</g, '&lt;') + ' (line ' + line + ')</p><button class="btn primary" onclick="localStorage.removeItem(\'sie_session\');location.reload()"><b>Reload</b><span>Your scores are kept</span></button></div>';
};
</script>
<script>
const DATA = {"sections": {"1": "Knowledge of Capital Markets", "2": "Understanding Products and Their Risks", "3": "Trading, Customer Accounts and Prohibited Activities", "4": "Overview of the Regulatory Framework"}, "weights": {"1": 12, "2": 33, "3": 23, "4": 7}, "questions": [{"id": 1, "s": "1", "t": "Regulators", "q": "Which organization writes rules for municipal securities dealers but does not enforce them?", "c": ["The SEC", "The Federal Reserve", "The MSRB", "FINRA"], "a": 2, "e": "The MSRB writes municipal rules. FINRA and the bank regulators enforce them."}, {"id": 2, "s": "1", "t": "Laws", "q": "The Securities Act of 1933 mainly regulates:", "c": ["Trading on the secondary market", "Investment companies", "Investment advisers", "New issues in the primary market"], "a": 3, "e": "The 1933 Act is the \"paper act\" for new issues: registration statement and prospectus. The 1934 Act covers the secondary market."}, {"id": 3, "s": "1", "t": "Laws", "q": "Which law created the SEC?", "c": ["Securities Act of 1933", "Securities Exchange Act of 1934", "Investment Company Act of 1940", "Trust Indenture Act of 1939"], "a": 1, "e": "The Securities Exchange Act of 1934 created the SEC."}, {"id": 4, "s": "1", "t": "Underwriting", "q": "During the cooling-off period, a registered rep may:", "c": ["Guarantee an allocation", "Send a final prospectus with a price", "Accept a customer's check for the new issue", "Take indications of interest"], "a": 3, "e": "No sales or binding orders during cooling-off. Reps may take non-binding indications of interest and hand out the red herring."}, {"id": 5, "s": "1", "t": "Underwriting", "q": "The preliminary prospectus is known as a:", "c": ["Official statement", "Offering circular", "Red herring", "Tombstone"], "a": 2, "e": "The red herring lacks the final price and effective date."}, {"id": 6, "s": "1", "t": "Underwriting", "q": "In which underwriting does the underwriter buy the entire issue and take the risk of unsold shares?", "c": ["Firm commitment", "All-or-none", "Best efforts", "Mini-max"], "a": 0, "e": "In a firm commitment the underwriter buys the whole issue as principal."}, {"id": 7, "s": "1", "t": "Underwriting", "q": "The largest part of an underwriting spread is usually the:", "c": ["Stabilizing fee", "Underwriting fee", "Manager's fee", "Selling concession"], "a": 3, "e": "The selling concession, paid to whoever sells the shares, is typically the largest piece."}, {"id": 8, "s": "1", "t": "Exempt", "q": "Commercial paper is exempt from registration under the 1933 Act when its maturity is no more than:", "c": ["90 days", "1 year", "180 days", "270 days"], "a": 3, "e": "Commercial paper with a maturity of 270 days or less is exempt."}, {"id": 9, "s": "1", "t": "Exempt", "q": "Under Regulation D Rule 506(b), how many non-accredited investors may buy in a 12-month period?", "c": ["25", "10", "35", "Unlimited"], "a": 2, "e": "Rule 506(b) allows up to 35 non-accredited (but sophisticated) purchasers."}, {"id": 10, "s": "1", "t": "Exempt", "q": "An individual qualifies as an accredited investor with:", "c": ["$500,000 in a brokerage account", "$1 million net worth including the primary residence", "$150,000 income each of the last 2 years", "$200,000 income in each of the last 2 years, expected again this year"], "a": 3, "e": "$200,000 individual income ($300,000 joint) for 2 years with the same expected, or $1 million net worth excluding the home."}, {"id": 11, "s": "1", "t": "Rule 144", "q": "An affiliate wants to sell control stock under Rule 144. The company has 10,000,000 shares outstanding and average weekly volume over the past 4 weeks was 120,000 shares. The most the affiliate can sell in 90 days is:", "c": ["1,000,000 shares", "100,000 shares", "120,000 shares", "240,000 shares"], "a": 2, "e": "The limit is the greater of 1% of outstanding (100,000) or the 4-week average weekly volume (120,000)."}, {"id": 12, "s": "1", "t": "Rule 144", "q": "Restricted stock of an SEC reporting company must generally be held how long before resale under Rule 144?", "c": ["2 years", "6 months", "90 days", "1 year"], "a": 1, "e": "6 months for reporting companies; 1 year for non-reporting companies."}, {"id": 13, "s": "1", "t": "Economics", "q": "Which is a leading economic indicator?", "c": ["Duration of unemployment", "The prime rate", "Industrial production", "Building permits"], "a": 3, "e": "Building permits are leading. Industrial production is coincident. Unemployment duration and the prime rate are lagging."}, {"id": 14, "s": "1", "t": "Economics", "q": "Which is a lagging indicator?", "c": ["Average duration of unemployment", "Personal income", "The S&P 500", "Average weekly hours"], "a": 0, "e": "Average duration of unemployment is lagging. Personal income is coincident; the others are leading."}, {"id": 15, "s": "1", "t": "Fed", "q": "To ease monetary policy, the FOMC would most likely:", "c": ["Raise the discount rate", "Raise the reserve requirement", "Buy Treasury securities in the open market", "Sell Treasury securities in the open market"], "a": 2, "e": "Buying securities puts money into the banking system and lowers rates."}, {"id": 16, "s": "1", "t": "Rates", "q": "The rate banks charge each other for overnight loans of reserves is the:", "c": ["Prime rate", "Discount rate", "Federal funds rate", "Broker call rate"], "a": 2, "e": "The federal funds rate. The Fed sets a target for it."}, {"id": 17, "s": "1", "t": "Economics", "q": "A weaker U.S. dollar generally:", "c": ["Helps U.S. exporters", "Helps U.S. importers", "Makes foreign travel cheaper for Americans", "Lowers the price of imported goods"], "a": 0, "e": "A weaker dollar makes U.S. goods cheaper abroad, helping exporters."}, {"id": 18, "s": "1", "t": "Economics", "q": "An inverted yield curve means:", "c": ["Short-term rates are higher than long-term rates", "Rates are rising across all maturities", "All rates are equal", "Long-term rates are higher than short-term rates"], "a": 0, "e": "Inverted: short-term yields above long-term yields; often seen as a recession warning."}, {"id": 19, "s": "1", "t": "Participants", "q": "A firm acting as a dealer in a trade:", "c": ["Can also act as broker in the same trade", "Buys or sells from its own inventory and charges a markup or markdown", "Charges a commission", "Acts as agent"], "a": 1, "e": "A dealer is a principal. A firm can't be both broker and dealer in the same trade."}, {"id": 20, "s": "1", "t": "Participants", "q": "Which entity keeps the records of who owns a company's shares and cancels and issues certificates?", "c": ["Custodian", "Registrar", "Transfer agent", "Underwriter"], "a": 2, "e": "The transfer agent keeps ownership records. The registrar audits the transfer agent."}, {"id": 21, "s": "2", "t": "Common stock", "q": "Cumulative voting mainly benefits:", "c": ["Minority shareholders", "Bondholders", "Majority shareholders", "Preferred stockholders"], "a": 0, "e": "Cumulative voting lets a shareholder put all votes on one candidate, helping minority holders win a seat."}, {"id": 22, "s": "2", "t": "Common stock", "q": "Treasury stock:", "c": ["Has voting rights", "Receives dividends", "Was issued and then repurchased by the company", "Is issued by the U.S. Treasury"], "a": 2, "e": "Treasury stock is repurchased stock. It has no vote and gets no dividends, and isn't counted as outstanding."}, {"id": 23, "s": "2", "t": "Common stock", "q": "A customer owns 100 shares at $60. After a 3-for-2 split, the customer owns:", "c": ["150 shares at $40", "200 shares at $30", "66 shares at $90", "150 shares at $60"], "a": 0, "e": "100 x 3/2 = 150 shares; $6,000 / 150 = $40. Total value stays the same."}, {"id": 24, "s": "2", "t": "Dividends", "q": "With T+1 settlement, the ex-dividend date is:", "c": ["One business day before the record date", "The same day as the record date", "Two business days before the record date", "One business day after the record date"], "a": 1, "e": "With T+1 settlement, the ex-date and record date are the same day."}, {"id": 25, "s": "2", "t": "Dividends", "q": "Which order of dividend dates is correct?", "c": ["Ex, declaration, record, payable", "Record, declaration, ex, payable", "Declaration, ex, record, payable", "Declaration, record, payable, ex"], "a": 2, "e": "D-E-R-P: declaration, ex-dividend, record, payable."}, {"id": 26, "s": "2", "t": "Common stock", "q": "Over the long term, which investment has historically been the best hedge against inflation?", "c": ["Fixed annuities", "Treasury bonds", "Money market funds", "Common stock"], "a": 3, "e": "Common stock has historically outpaced inflation; fixed-income investments are hurt most by inflation."}, {"id": 27, "s": "2", "t": "Preferred", "q": "A company skipped its preferred dividend last year. Which preferred stockholders must be paid the missed dividend before common stockholders get a dividend?", "c": ["Participating", "Noncumulative", "Callable", "Cumulative"], "a": 3, "e": "Cumulative preferred dividends in arrears must be paid before any common dividend."}, {"id": 28, "s": "2", "t": "Preferred", "q": "Which preferred stock is least affected by changes in interest rates?", "c": ["Convertible preferred", "Straight preferred", "Cumulative preferred", "Callable preferred"], "a": 0, "e": "Convertible preferred tends to trade with the common stock, so it's less sensitive to interest rates. (Adjustable-rate preferred would also qualify if offered.)"}, {"id": 29, "s": "2", "t": "Rights", "q": "Which statement about warrants is true?", "c": ["They are short-term, usually a few weeks", "They are usually issued with an exercise price below market", "They are issued only to existing shareholders", "They are often attached to bonds as a sweetener"], "a": 3, "e": "Warrants are long-term, usually priced above the market at issue, and often attached to bonds or preferred to make them more attractive."}, {"id": 30, "s": "2", "t": "ADRs", "q": "The main extra risk of an ADR compared to a U.S. stock is:", "c": ["Call risk", "Currency risk", "Reinvestment risk", "Prepayment risk"], "a": 1, "e": "ADRs represent foreign shares, so exchange-rate (currency) risk applies, plus political risk."}, {"id": 31, "s": "2", "t": "Bonds", "q": "A corporate bond quoted at 97.25 costs:", "c": ["$972.50", "$97.25", "$9,725", "$1,097.25"], "a": 0, "e": "Bond prices are a percent of $1,000 par: 97.25% x $1,000 = $972.50."}, {"id": 32, "s": "2", "t": "Bonds", "q": "A 6% bond is trading at a discount. Which is correct?", "c": ["Current yield is below 6%", "All yields equal 6%", "Yield to maturity is below the current yield", "Yield to maturity is above the current yield"], "a": 3, "e": "At a discount: coupon < current yield < YTM < YTC."}, {"id": 33, "s": "2", "t": "Bonds", "q": "A 5% corporate bond trades at $1,250. Its current yield is:", "c": ["3.75%", "6.25%", "5%", "4%"], "a": 3, "e": "$50 annual interest / $1,250 = 4%."}, {"id": 34, "s": "2", "t": "Bonds", "q": "When interest rates rise, which bond's price will fall the most?", "c": ["A 20-year zero-coupon bond", "A 20-year 6% bond", "A 2-year 6% bond", "A 5-year floating-rate note"], "a": 0, "e": "Longer maturity and lower coupon mean more price sensitivity. A long-term zero is the most sensitive."}, {"id": 35, "s": "2", "t": "Bonds", "q": "Which bond is unsecured?", "c": ["Collateral trust bond", "Equipment trust certificate", "Mortgage bond", "Debenture"], "a": 3, "e": "A debenture is backed only by the issuer's credit."}, {"id": 36, "s": "2", "t": "Bonds", "q": "In a corporate liquidation, who is paid first among these?", "c": ["Holders of subordinated debentures", "Common stockholders", "Preferred stockholders", "Secured bondholders"], "a": 3, "e": "Secured creditors come before unsecured, subordinated debt, preferred and common."}, {"id": 37, "s": "2", "t": "Bonds", "q": "Which is the lowest investment-grade rating from S&P?", "c": ["AAA", "BB", "BBB", "A"], "a": 2, "e": "BBB (Baa from Moody's) is the lowest investment grade. BB and below is high-yield."}, {"id": 38, "s": "2", "t": "Bonds", "q": "A $1,000 bond is convertible at $25 per share. How many shares does it convert into?", "c": ["250", "25", "400", "40"], "a": 3, "e": "$1,000 / $25 = 40 shares."}, {"id": 39, "s": "2", "t": "Bonds", "q": "An investor buys a callable bond. Falling interest rates create which risk?", "c": ["Default risk", "Call and reinvestment risk", "Liquidity risk", "Inflation risk"], "a": 1, "e": "When rates fall, issuers call bonds, forcing reinvestment at lower rates."}, {"id": 40, "s": "2", "t": "Bonds", "q": "Which investment has no reinvestment risk?", "c": ["A zero-coupon bond", "A callable corporate bond", "A GNMA pass-through", "A 10-year Treasury note"], "a": 0, "e": "Zero-coupon bonds pay nothing until maturity, so there's nothing to reinvest."}, {"id": 41, "s": "2", "t": "Bonds", "q": "Accrued interest on corporate bonds is calculated using:", "c": ["30-day months / 365-day year", "Actual days / 360-day year", "Actual days / actual year", "30-day months / 360-day year"], "a": 3, "e": "Corporates and munis use 30/360. Treasuries use actual/actual."}, {"id": 42, "s": "2", "t": "Treasuries", "q": "Which Treasury security is issued at a discount and matures in one year or less?", "c": ["T-note", "T-bond", "TIPS", "T-bill"], "a": 3, "e": "T-bills have no coupon; they're sold at a discount and mature at par."}, {"id": 43, "s": "2", "t": "Treasuries", "q": "Interest on Treasury notes is:", "c": ["Exempt from all taxes", "Taxable at all levels", "Exempt from federal tax, taxable by states", "Taxable by the federal government, exempt from state and local tax"], "a": 3, "e": "Treasury interest is federally taxable but exempt from state and local income taxes."}, {"id": 44, "s": "2", "t": "Treasuries", "q": "TIPS mainly protect investors against:", "c": ["Interest-rate risk", "Credit risk", "Purchasing power risk", "Liquidity risk"], "a": 2, "e": "TIPS principal adjusts with CPI, protecting against inflation."}, {"id": 45, "s": "2", "t": "Agencies", "q": "Which mortgage security is backed by the full faith and credit of the U.S. government?", "c": ["GNMA", "FNMA", "A private-label CMO", "FHLMC"], "a": 0, "e": "Only Ginnie Mae carries the full faith and credit guarantee."}, {"id": 46, "s": "2", "t": "Agencies", "q": "Mortgage-backed securities face prepayment risk mainly when:", "c": ["The dollar strengthens", "Interest rates fall", "Interest rates rise", "Inflation rises"], "a": 1, "e": "Falling rates lead homeowners to refinance, paying principal back early."}, {"id": 47, "s": "2", "t": "Agencies", "q": "Which CMO tranche has the most protection against prepayment and extension risk?", "c": ["Z-tranche", "Support tranche", "Companion tranche", "PAC tranche"], "a": 3, "e": "Planned amortization class (PAC) tranches get the most certain cash flows; companion tranches absorb the variability."}, {"id": 48, "s": "2", "t": "Munis", "q": "General obligation bonds are backed by:", "c": ["A specific excise tax only", "Revenue from a specific project", "The issuer's taxing power", "Federal grants"], "a": 2, "e": "GO bonds are backed by the full faith and credit (taxing power) of the issuer."}, {"id": 49, "s": "2", "t": "Munis", "q": "A toll road bond paid only from tolls is a:", "c": ["Moral obligation bond", "General obligation bond", "Special assessment bond", "Revenue bond"], "a": 3, "e": "Revenue bonds are paid from the revenue of the project they finance."}, {"id": 50, "s": "2", "t": "Munis", "q": "A customer in the 30% tax bracket buys a 3.5% municipal bond. Its tax-equivalent yield is:", "c": ["5.00%", "6.50%", "4.55%", "2.45%"], "a": 0, "e": "3.5% / (1 - 0.30) = 3.5 / 0.70 = 5.00%."}, {"id": 51, "s": "2", "t": "Munis", "q": "Municipal bonds are generally least suitable for:", "c": ["An investor in the issuing state", "A trust in a high bracket", "An IRA account", "A wealthy investor in a high tax bracket"], "a": 2, "e": "An IRA is already tax-deferred, so muni tax benefits are wasted and yields are lower."}, {"id": 52, "s": "2", "t": "Munis", "q": "A municipality issues short-term notes to be repaid from an upcoming bond sale. These are:", "c": ["BANs", "RANs", "GANs", "TANs"], "a": 0, "e": "Bond anticipation notes (BANs) are repaid from a future bond issue."}, {"id": 53, "s": "2", "t": "Munis", "q": "The disclosure document for a new municipal issue is the:", "c": ["Prospectus", "Official statement", "Indenture", "Offering circular"], "a": 1, "e": "The official statement is the muni version of a prospectus."}, {"id": 54, "s": "2", "t": "Money market", "q": "Which money market instrument is used mainly to finance international trade?", "c": ["Negotiable CD", "Commercial paper", "Banker's acceptance", "Repurchase agreement"], "a": 2, "e": "Banker's acceptances are time drafts guaranteed by a bank, common in import and export trade."}, {"id": 55, "s": "2", "t": "Money market", "q": "A repurchase agreement is best described as:", "c": ["An option to buy securities", "A short-term loan secured by securities", "A long-term bank deposit", "A type of preferred stock"], "a": 1, "e": "In a repo, one party sells securities and agrees to buy them back at a higher price: in effect a secured loan."}, {"id": 56, "s": "2", "t": "Options", "q": "An investor buys 1 XYZ Oct 40 call at 2.50. The breakeven is:", "c": ["$45.00", "$37.50", "$42.50", "$40.00"], "a": 2, "e": "Calls: strike + premium = 40 + 2.50 = $42.50."}, {"id": 57, "s": "2", "t": "Options", "q": "An investor buys 1 ABC Mar 60 put at 4. The maximum gain is:", "c": ["$400", "$5,600", "$6,000", "Unlimited"], "a": 1, "e": "(Strike - premium) x 100 = (60 - 4) x 100 = $5,600, if the stock goes to zero."}, {"id": 58, "s": "2", "t": "Options", "q": "Which option position has unlimited risk?", "c": ["Buying a put", "Buying a call", "Writing a naked call", "Writing a covered call"], "a": 2, "e": "A naked call writer must deliver stock that could rise without limit."}, {"id": 59, "s": "2", "t": "Options", "q": "An investor buys 1 XYZ 50 call at 3. XYZ rises to $58 and the investor closes the call at its intrinsic value. The profit is:", "c": ["$5,800", "$500", "$800", "$300"], "a": 1, "e": "Intrinsic value $8 x 100 = $800, minus $300 cost = $500 profit."}, {"id": 60, "s": "2", "t": "Options", "q": "A put option is in the money when:", "c": ["The stock price is below the strike", "The stock price equals the strike", "The premium exceeds the strike", "The stock price is above the strike"], "a": 0, "e": "Puts are in the money when the stock is below the strike. \"Call up, put down.\""}, {"id": 61, "s": "2", "t": "Options", "q": "An investor owns 100 shares of a stock they expect to stay flat and wants extra income. The investor should:", "c": ["Write a covered call", "Write a naked call", "Buy a naked put", "Buy a call"], "a": 0, "e": "Writing a covered call earns premium income; it gives up upside above the strike."}, {"id": 62, "s": "2", "t": "Options", "q": "An investor who owns stock and wants protection against a big price drop should:", "c": ["Buy a put", "Sell a call", "Sell a put", "Buy a call"], "a": 0, "e": "A protective put sets a floor on the stock's value."}, {"id": 63, "s": "2", "t": "Options", "q": "Who issues and guarantees standardized listed options?", "c": ["FINRA", "The CBOE", "The Options Clearing Corporation", "The SEC"], "a": 2, "e": "The OCC issues and guarantees listed options."}, {"id": 64, "s": "2", "t": "Options", "q": "The Options Disclosure Document must be delivered:", "c": ["Only on request", "After the first trade", "Within 15 days of approval", "At or before the time the account is approved for options"], "a": 3, "e": "The ODD must be given at or before account approval."}, {"id": 65, "s": "2", "t": "Options", "q": "A writer of a put option has:", "c": ["The obligation to sell stock if assigned", "The obligation to buy stock if assigned", "The right to sell stock", "The right to buy stock"], "a": 1, "e": "Put writers must buy the stock at the strike if assigned."}, {"id": 66, "s": "2", "t": "Funds", "q": "Mutual fund shares are bought at:", "c": ["The previous day's closing NAV", "Whatever price the investor bids", "The next calculated public offering price", "The market price on an exchange"], "a": 2, "e": "Forward pricing: orders get the next price computed after the order is received."}, {"id": 67, "s": "2", "t": "Funds", "q": "Which share class is usually best for a large, long-term investment in a mutual fund?", "c": ["Class A", "Class B", "Class C", "They are all the same"], "a": 0, "e": "Class A shares have a front load that drops at breakpoints and low ongoing 12b-1 fees, best for large, long-term investments."}, {"id": 68, "s": "2", "t": "Funds", "q": "Class C mutual fund shares are generally most suitable for:", "c": ["An investor who wants breakpoints", "A short-term holding period", "A large investment held 20 years", "Investors in a 529 plan only"], "a": 1, "e": "C shares have a level load with higher ongoing fees, so they fit shorter holding periods."}, {"id": 69, "s": "2", "t": "Funds", "q": "The maximum sales charge FINRA allows on a mutual fund is:", "c": ["10%", "7.25%", "5%", "8.5%"], "a": 3, "e": "8.5% of the public offering price."}, {"id": 70, "s": "2", "t": "Funds", "q": "A fund may not call itself \"no-load\" if its 12b-1 fee is more than:", "c": ["0.10%", "0.50%", "1.00%", "0.25%"], "a": 3, "e": "No-load funds can charge at most a 0.25% 12b-1 fee."}, {"id": 71, "s": "2", "t": "Funds", "q": "A letter of intent lets an investor get a breakpoint by investing the required amount within:", "c": ["90 days", "13 months", "6 months", "2 years"], "a": 1, "e": "An LOI covers 13 months and can be backdated up to 90 days."}, {"id": 72, "s": "2", "t": "Funds", "q": "Which statement about closed-end funds is true?", "c": ["They trade on an exchange and can sell at a premium or discount to NAV", "They continuously issue new shares", "They redeem shares daily at NAV", "They cannot use leverage"], "a": 0, "e": "Closed-end funds issue a fixed number of shares that trade on an exchange at market prices."}, {"id": 73, "s": "2", "t": "Funds", "q": "Which can be bought and sold throughout the trading day at market prices?", "c": ["Unit investment trust", "Mutual fund", "ETF", "Fixed annuity"], "a": 2, "e": "ETFs trade on exchanges all day. Mutual funds price once a day."}, {"id": 74, "s": "2", "t": "Funds", "q": "Leveraged and inverse ETFs are generally designed to achieve their stated goal over:", "c": ["One month", "The life of the fund", "One trading day", "One year"], "a": 2, "e": "They reset daily. FINRA says they're generally not suitable for retail customers holding them longer than a day."}, {"id": 75, "s": "2", "t": "Funds", "q": "Which part of a mutual fund holds the fund's cash and securities?", "c": ["Underwriter", "Transfer agent", "Investment adviser", "Custodian"], "a": 3, "e": "The custodian, usually a bank, safeguards the assets."}, {"id": 76, "s": "2", "t": "Funds", "q": "A mutual fund investor reinvests all capital gains distributions. For taxes, the distributions are:", "c": ["Not taxable until shares are sold", "Taxable in the year distributed", "Tax-free", "Taxable only if over $1,000"], "a": 1, "e": "Distributions are taxable when paid, even if reinvested."}, {"id": 77, "s": "2", "t": "Funds", "q": "Which investment company has a fixed portfolio, no board of directors, and redeemable units?", "c": ["Closed-end fund", "Open-end fund", "Unit investment trust", "Face-amount certificate company"], "a": 2, "e": "A UIT holds a fixed, unmanaged portfolio and issues redeemable units."}, {"id": 78, "s": "2", "t": "Alternatives", "q": "To avoid tax at the trust level, a REIT must distribute at least what percent of its taxable income?", "c": ["90%", "100%", "80%", "75%"], "a": 0, "e": "REITs must distribute at least 90%."}, {"id": 79, "s": "2", "t": "Alternatives", "q": "Which feature is true of direct participation programs?", "c": ["Income and losses flow through to investors", "Losses stay inside the program", "They are highly liquid", "Limited partners manage the business"], "a": 0, "e": "DPPs are flow-through vehicles. Limited partners are passive; the big risk is illiquidity."}, {"id": 80, "s": "2", "t": "Alternatives", "q": "In a limited partnership, who has unlimited liability?", "c": ["Limited partners", "The general partner", "Both", "Neither"], "a": 1, "e": "The general partner runs the business and has unlimited liability."}, {"id": 81, "s": "2", "t": "Alternatives", "q": "Which statement about ETNs is correct?", "c": ["They are mutual funds", "They carry the credit risk of the issuing bank", "They are insured by SIPC against market loss", "They are backed by a pool of securities"], "a": 1, "e": "ETNs are unsecured debt of the issuer, so the issuer's credit matters."}, {"id": 82, "s": "2", "t": "Alternatives", "q": "A futures contract is:", "c": ["A right but not an obligation to buy", "A type of equity", "Regulated mainly by the MSRB", "An obligation to buy or sell at a set price on a future date"], "a": 3, "e": "Futures are obligations for both sides. The CFTC regulates them."}, {"id": 83, "s": "2", "t": "Annuities", "q": "Which product is NOT a security?", "c": ["Variable life insurance", "Variable annuity", "Mutual fund", "Fixed annuity"], "a": 3, "e": "A fixed annuity's guarantee comes from the insurer, so it's an insurance product, not a security."}, {"id": 84, "s": "2", "t": "Annuities", "q": "A customer takes a withdrawal from a nonqualified variable annuity before annuitizing. How is it taxed?", "c": ["It is all taxed as capital gains", "It is tax-free", "Earnings come out first and are taxed as ordinary income", "Cost basis comes out first, tax-free"], "a": 2, "e": "Withdrawals are LIFO: earnings first, taxed as ordinary income, plus a 10% penalty before 59½."}, {"id": 85, "s": "2", "t": "Annuities", "q": "Which annuity payout option gives the highest monthly payment?", "c": ["Joint and last survivor", "Life only", "Life with 10-year period certain", "Life with refund"], "a": 1, "e": "Life only (straight life) pays the most per month because payments stop at death."}, {"id": 86, "s": "2", "t": "Annuities", "q": "If a variable annuity's subaccounts earn more than the assumed interest rate (AIR), the next annuity payment will:", "c": ["Increase", "Stop", "Stay the same", "Decrease"], "a": 0, "e": "Earning above the AIR raises payments; below it lowers them."}, {"id": 87, "s": "2", "t": "Annuities", "q": "A tax-free exchange of one annuity for another is a:", "c": ["Direct transfer", "1031 exchange", "1035 exchange", "Rollover"], "a": 2, "e": "Section 1035 allows tax-free exchanges of annuities and life policies."}, {"id": 88, "s": "2", "t": "Retirement", "q": "In 2026, the maximum IRA contribution for a 52-year-old with enough earned income is:", "c": ["$7,500", "$7,000", "$24,500", "$8,600"], "a": 3, "e": "$7,500 plus the $1,100 catch-up for age 50+ = $8,600."}, {"id": 89, "s": "2", "t": "Retirement", "q": "Qualified withdrawals from a Roth IRA are:", "c": ["Always penalized before 70", "Taxed as ordinary income", "Tax-free if the account is 5 years old and the owner is 59½ or older", "Taxed as capital gains"], "a": 2, "e": "Roth contributions are after-tax; qualified withdrawals are tax-free."}, {"id": 90, "s": "2", "t": "Retirement", "q": "Which is NOT allowed as an investment in an IRA?", "c": ["Treasury bonds", "Municipal bonds", "Mutual funds", "Collectibles such as art"], "a": 3, "e": "Collectibles are prohibited (with exceptions for certain U.S. gold and silver coins). Munis are allowed, just usually not suitable."}, {"id": 91, "s": "2", "t": "Retirement", "q": "An investor takes a 60-day rollover from a 401(k) paid directly to them. The plan must withhold:", "c": ["30%", "20%", "10%", "0%"], "a": 1, "e": "Distributions from employer plans paid to the participant have mandatory 20% withholding. A direct trustee-to-trustee transfer avoids it."}, {"id": 92, "s": "2", "t": "Retirement", "q": "Which law protects participants in private-sector retirement plans?", "c": ["The Investment Company Act", "The Trust Indenture Act", "ERISA", "The Uniform Securities Act"], "a": 2, "e": "ERISA covers private-sector employer plans, not government plans."}, {"id": 93, "s": "2", "t": "Retirement", "q": "A teacher at a public school would most likely participate in which plan?", "c": ["403(b)", "SEP-IRA", "SIMPLE IRA", "401(k)"], "a": 0, "e": "403(b) plans are for public schools and nonprofit organizations."}, {"id": 94, "s": "2", "t": "Education", "q": "Which statement about 529 plans is true?", "c": ["Qualified withdrawals are tax-free", "They are regulated as bank products", "The beneficiary controls the account", "Contributions are federally tax-deductible"], "a": 0, "e": "Qualified education withdrawals are tax-free. The owner keeps control. Contributions aren't federally deductible."}, {"id": 95, "s": "2", "t": "Education", "q": "The maximum annual contribution to a Coverdell ESA per beneficiary is:", "c": ["$2,000", "$19,000", "$5,000", "$7,500"], "a": 0, "e": "Coverdell ESAs are limited to $2,000 a year per beneficiary."}, {"id": 96, "s": "2", "t": "Risks", "q": "Which risk can be reduced through diversification?", "c": ["Purchasing power risk", "Business risk", "Interest-rate risk", "Market risk"], "a": 1, "e": "Business risk is unsystematic, so diversifying reduces it. The others are systematic."}, {"id": 97, "s": "2", "t": "Risks", "q": "Purchasing power risk is greatest for an investor who holds:", "c": ["Common stocks", "Real estate", "TIPS", "Long-term fixed-rate bonds"], "a": 3, "e": "Fixed payments lose value to inflation. Long-term fixed-rate bonds are hit hardest."}, {"id": 98, "s": "2", "t": "Risks", "q": "A stock with a beta of 1.5 is expected to:", "c": ["Move 50% more than the market", "Move half as much as the market", "Move opposite to the market", "Not move with the market"], "a": 0, "e": "Beta above 1 means more volatile than the market."}, {"id": 99, "s": "2", "t": "Risks", "q": "A customer's portfolio is 80% in one technology stock. The biggest concern is:", "c": ["Reinvestment risk", "Concentration risk", "Currency risk", "Call risk"], "a": 1, "e": "Too much in one security or sector is concentration risk."}, {"id": 100, "s": "2", "t": "Taxes", "q": "A customer buys stock for $40, receives $2 in dividends, and the stock is now $44. What is the total return?", "c": ["5%", "15%", "10%", "20%"], "a": 1, "e": "($2 income + $4 gain) / $40 = 15%."}, {"id": 101, "s": "2", "t": "Taxes", "q": "A customer sells stock at a loss on May 10 and buys it back on May 25. What happens?", "c": ["The investor pays a 10% penalty", "The loss is disallowed and added to the new shares' cost basis", "The loss becomes long-term", "The loss is allowed"], "a": 1, "e": "Repurchasing within 30 days triggers the wash sale rule."}, {"id": 102, "s": "2", "t": "Taxes", "q": "A customer bought stock on March 10 of last year and sells it on March 10 of this year at a gain. The gain is:", "c": ["Ordinary income only if over $3,000", "Tax-free", "Short-term", "Long-term"], "a": 2, "e": "Long-term requires holding more than one year. Selling on the one-year anniversary is exactly one year, so the gain is short-term. Selling one day later would make it long-term."}, {"id": 103, "s": "2", "t": "Taxes", "q": "An investor has $10,000 of net capital losses this year and no gains. How much can offset ordinary income this year?", "c": ["$3,000", "$0", "$10,000", "$5,000"], "a": 0, "e": "Up to $3,000 a year; the rest carries forward."}, {"id": 104, "s": "2", "t": "Taxes", "q": "The cost basis of inherited stock is generally:", "c": ["What the deceased paid", "The average of the two", "The value on the date of death", "Zero"], "a": 2, "e": "Inherited securities get a stepped-up basis to the date-of-death value and are treated as long-term."}, {"id": 105, "s": "3", "t": "Orders", "q": "A customer wants to buy stock only if it can be bought at $30 or lower. The customer should enter a:", "c": ["Market order", "Buy limit at $30", "Sell limit at $30", "Buy stop at $30"], "a": 1, "e": "A buy limit executes at the limit price or lower."}, {"id": 106, "s": "3", "t": "Orders", "q": "A customer who is short a stock and wants to limit losses should place a:", "c": ["Sell limit above the market", "Sell stop below the market", "Buy limit below the market", "Buy stop above the market"], "a": 3, "e": "A buy stop above the market triggers a purchase to cover the short if the price rises."}, {"id": 107, "s": "3", "t": "Orders", "q": "Which order guarantees execution but not price?", "c": ["Stop-limit order", "Market order", "All-or-none order", "Limit order"], "a": 1, "e": "Market orders execute right away at the best available price."}, {"id": 108, "s": "3", "t": "Orders", "q": "An order to be filled in full immediately or cancelled is:", "c": ["IOC", "FOK", "GTC", "AON"], "a": 1, "e": "Fill or kill: the whole order immediately, or nothing."}, {"id": 109, "s": "3", "t": "Orders", "q": "A customer tells a rep, \"Buy 500 shares of XYZ today, but use your judgment on the time and price.\" This order:", "c": ["Requires written discretionary authority", "Is not discretionary and needs no written authority", "Requires a power of attorney", "Is prohibited"], "a": 1, "e": "Choosing only time and price is not discretion. A \"not-held\" market order like this needs no written authority."}, {"id": 110, "s": "3", "t": "Orders", "q": "A customer sells short 100 shares at $50. The maximum potential loss is:", "c": ["Unlimited", "$0", "$50", "$5,000"], "a": 0, "e": "There's no limit to how high the stock can rise."}, {"id": 111, "s": "3", "t": "Orders", "q": "Before executing a short sale, Regulation SHO requires the broker to:", "c": ["Get written approval from FINRA", "Collect 100% of the sale price", "Locate shares that can be borrowed", "Wait for an uptick"], "a": 2, "e": "The locate requirement: reasonable grounds to believe the shares can be borrowed and delivered."}, {"id": 112, "s": "3", "t": "Trading", "q": "A customer wants to buy. The quote is 25.10 bid, 25.20 ask. The customer will pay:", "c": ["$25.20", "$25.15", "$25.10", "$25.30"], "a": 0, "e": "Customers buy at the ask and sell at the bid."}, {"id": 113, "s": "3", "t": "Trading", "q": "Regular-way settlement for corporate stock is:", "c": ["T+3", "T+2", "Same day", "T+1"], "a": 3, "e": "Since May 2024, regular way is T+1."}, {"id": 114, "s": "3", "t": "Trading", "q": "The FINRA 5% markup policy:", "c": ["Applies to new issues sold by prospectus", "Is a guideline for fair and reasonable markups", "Applies to mutual fund sales charges", "Is a strict rule that markups can never exceed 5%"], "a": 1, "e": "It's a guideline; factors such as price, amount, and services matter. It doesn't apply to prospectus offerings or funds."}, {"id": 115, "s": "3", "t": "Trading", "q": "Trade confirmations must be sent:", "c": ["At or before the completion of the transaction", "Quarterly", "Within 30 days", "Monthly"], "a": 0, "e": "Confirmations are due at or before completion (settlement)."}, {"id": 116, "s": "3", "t": "Margin", "q": "The Regulation T initial margin requirement for buying stock is:", "c": ["50%", "30%", "100%", "25%"], "a": 0, "e": "Reg T sets 50%."}, {"id": 117, "s": "3", "t": "Margin", "q": "The FINRA minimum equity to open a margin account is:", "c": ["$500", "$5,000", "$2,000", "$25,000"], "a": 2, "e": "$2,000, or 100% of the purchase if it costs less."}, {"id": 118, "s": "3", "t": "Margin", "q": "Which document is required for every margin account?", "c": ["Hypothecation agreement", "Power of attorney", "Loan consent agreement", "Trading authorization"], "a": 0, "e": "The hypothecation agreement pledges the securities as collateral. Loan consent is optional."}, {"id": 119, "s": "3", "t": "Margin", "q": "In June 2026, FINRA replaced its pattern day trader rule with an intraday margin rule. What happened to the special $25,000 minimum equity for day traders?", "c": ["It now applies to cash accounts too", "It still applies", "It was raised to $50,000", "It was eliminated, and day traders follow the regular margin minimums"], "a": 3, "e": "FINRA's intraday margin rule (effective June 4, 2026, phase-in to Oct 20, 2027) replaced the pattern day trader rule. Under the old rule, 4+ day trades in 5 business days meant keeping $25,000 equity. Older materials may still test the old rule."}, {"id": 120, "s": "3", "t": "Margin", "q": "A customer buys stock in a cash account and sells it before paying. The account will be:", "c": ["Closed permanently", "Converted to a margin account", "Frozen for 90 days", "Charged interest"], "a": 2, "e": "Freeriding results in a 90-day freeze: the customer must pay in full before buying."}, {"id": 121, "s": "3", "t": "Accounts", "q": "Under the Customer Identification Program, a firm must collect all of the following EXCEPT:", "c": ["Date of birth", "Annual income", "Address", "Name"], "a": 1, "e": "CIP requires name, date of birth, address and ID number. Income is suitability information, not CIP."}, {"id": 122, "s": "3", "t": "Accounts", "q": "A trusted contact person:", "c": ["Must be a family member", "Can make trades for the customer", "Is required before the account can be opened", "Must be age 18 or older and is contacted about possible exploitation"], "a": 3, "e": "The firm must make a reasonable effort to get one, but the account can open without it. The contact can't trade."}, {"id": 123, "s": "3", "t": "Accounts", "q": "A new account must be approved by:", "c": ["The customer's attorney", "The registered rep", "FINRA", "A principal"], "a": 3, "e": "A principal must approve each new account."}, {"id": 124, "s": "3", "t": "Accounts", "q": "Two owners hold a JTWROS account. One dies. The account:", "c": ["Goes to the deceased's estate", "Goes to the surviving owner", "Is split between estate and survivor", "Is frozen permanently"], "a": 1, "e": "Joint tenants with right of survivorship: the survivor takes the deceased's share."}, {"id": 125, "s": "3", "t": "Accounts", "q": "In a tenants in common account, when one owner dies, their share:", "c": ["Goes to the surviving owner", "Is forfeited", "Goes to the firm", "Goes to their estate"], "a": 3, "e": "TIC interests pass to the deceased owner's estate."}, {"id": 126, "s": "3", "t": "Accounts", "q": "Which is true of a UTMA account?", "c": ["It may be opened as a margin account", "The custodian owns the assets", "It can have two minors", "It uses the minor's Social Security number"], "a": 3, "e": "One custodian, one minor, minor's SSN, minor owns the assets, no margin."}, {"id": 127, "s": "3", "t": "Accounts", "q": "To open a margin account for a corporation, the firm needs a corporate resolution and:", "c": ["The corporate charter", "A partnership agreement", "A trust agreement", "Letters testamentary"], "a": 0, "e": "The charter shows the corporation can trade on margin."}, {"id": 128, "s": "3", "t": "Accounts", "q": "To trade in a discretionary account, the rep needs:", "c": ["Verbal authorization from the customer", "Prior written authorization from the customer and principal approval of the account", "Approval from FINRA", "Nothing extra"], "a": 1, "e": "Discretion over asset, action or amount needs written authorization and principal approval."}, {"id": 129, "s": "3", "t": "Accounts", "q": "A customer dies. The firm should first:", "c": ["Transfer the assets to the spouse", "Keep executing open orders", "Liquidate the account", "Freeze the account and cancel open orders"], "a": 3, "e": "Freeze the account, cancel open orders and wait for legal papers."}, {"id": 130, "s": "3", "t": "Accounts", "q": "Which customer is most likely to be suitable for a fee-based account?", "c": ["A customer with only a money market fund", "A buy-and-hold investor who trades twice a year", "A customer in a 529 plan", "An active investor who wants ongoing advice"], "a": 3, "e": "Putting a rarely-trading customer in a fee-based account can be \"reverse churning\"."}, {"id": 131, "s": "3", "t": "Reg BI", "q": "Regulation Best Interest applies when a broker-dealer:", "c": ["Executes an unsolicited trade", "Makes a recommendation to a retail customer", "Advertises on TV", "Trades with another firm"], "a": 1, "e": "Reg BI governs recommendations to retail customers."}, {"id": 132, "s": "3", "t": "Reg BI", "q": "Form CRS must be delivered to a retail investor:", "c": ["Before or at the earliest of a recommendation, an order, or opening an account", "Annually only", "Only when requested", "Within 30 days of opening the account"], "a": 0, "e": "Form CRS is due at the start of the relationship."}, {"id": 133, "s": "3", "t": "Seniors", "q": "Under FINRA Rule 2165, a specified adult includes:", "c": ["Anyone retired", "Only people with a court-appointed guardian", "Anyone 65 or older", "Anyone over 60"], "a": 2, "e": "65+, or 18+ with a mental or physical impairment the firm reasonably believes affects their ability to protect their interests."}, {"id": 134, "s": "3", "t": "Seniors", "q": "Under Rule 2165, a firm's initial hold on a disbursement may last up to:", "c": ["10 business days", "30 calendar days", "5 business days", "15 business days"], "a": 3, "e": "15 business days, extendable by 10 more, plus 30 more if the firm reports the matter to a state agency or court (55 total)."}, {"id": 135, "s": "3", "t": "Prohibited", "q": "A rep buys stock for their own account just before entering a large customer buy order. This is:", "c": ["Front running", "Freeriding", "Painting the tape", "Churning"], "a": 0, "e": "Trading ahead of a customer's block order is front running."}, {"id": 136, "s": "3", "t": "Prohibited", "q": "Excessive trading in a customer account to generate commissions is:", "c": ["Churning", "Front running", "Layering", "Marking the close"], "a": 0, "e": "Churning."}, {"id": 137, "s": "3", "t": "Prohibited", "q": "Two traders buy and sell the same stock to each other to create the appearance of volume. This is:", "c": ["Selling away", "Painting the tape", "Front running", "Breakpoint selling"], "a": 1, "e": "Painting the tape (wash or matched trades) creates fake activity."}, {"id": 138, "s": "3", "t": "Prohibited", "q": "A rep recommends a customer invest $48,000 in a fund with a breakpoint at $50,000, without mentioning it. This is:", "c": ["Breakpoint selling", "Front running", "Allowed under the 5% policy", "Acceptable if the customer agrees"], "a": 0, "e": "Breakpoint selling is a violation."}, {"id": 139, "s": "3", "t": "Prohibited", "q": "A rep may share in the profits and losses of a customer account only if:", "c": ["The customer agrees verbally", "The rep guarantees the customer against loss", "There's written approval from the firm and the customer, in proportion to the rep's investment", "The account is discretionary"], "a": 2, "e": "Written approval from both, and sharing proportional to the rep's contribution (unless an immediate family joint account)."}, {"id": 140, "s": "3", "t": "Prohibited", "q": "A rep may borrow money from a customer if:", "c": ["The firm's written procedures allow it and the customer is, for example, an immediate family member", "The rep repays within 30 days", "The customer offers", "The loan is under $1,000"], "a": 0, "e": "Only allowed categories (immediate family, a lending institution, etc.) and only if the firm's procedures permit it."}, {"id": 141, "s": "3", "t": "Prohibited", "q": "A rep sells a private investment to friends without telling the firm. This is:", "c": ["Outside business activity", "Front running", "Allowed if under $10,000", "Selling away"], "a": 3, "e": "Private securities transactions require prior written notice to the firm."}, {"id": 142, "s": "3", "t": "Prohibited", "q": "Under FINRA Rule 3220 (as amended in 2026), the most a rep may give in gifts to an employee of another firm per year is:", "c": ["$500", "$50", "$100", "$300"], "a": 3, "e": "The FINRA limit rose from $100 to $300 effective March 30, 2026. The MSRB limit is still $100."}, {"id": 143, "s": "3", "t": "Insider", "q": "Material nonpublic information was passed from a company officer to a friend, who traded on it. Who is liable?", "c": ["Only the officer", "Only the friend", "Both the tipper and the tippee", "Neither, if it was a casual conversation"], "a": 2, "e": "Both tipper and tippee can be liable."}, {"id": 144, "s": "3", "t": "Insider", "q": "The civil penalty for insider trading can be up to:", "c": ["Two times the profit made or loss avoided", "Three times the profit made or loss avoided", "The profit made", "$5,000"], "a": 1, "e": "Up to three times the profit gained or loss avoided."}, {"id": 145, "s": "3", "t": "AML", "q": "Which stage of money laundering involves moving funds around to hide their source?", "c": ["Placement", "Integration", "Layering", "Structuring"], "a": 2, "e": "Layering uses many transfers and transactions to obscure the money's origin."}, {"id": 146, "s": "3", "t": "AML", "q": "A broker-dealer must file a Currency Transaction Report for cash received of:", "c": ["More than $25,000", "$3,000 or more", "More than $10,000", "$5,000 or more"], "a": 2, "e": "CTRs are for cash over $10,000 in one business day."}, {"id": 147, "s": "3", "t": "AML", "q": "A customer deposits $9,500 in cash on Monday and $9,500 on Tuesday, saying they want to avoid paperwork. This is:", "c": ["Layering, which is legal", "Legal because each is under $10,000", "Only reportable if over $25,000", "Structuring, which is illegal"], "a": 3, "e": "Breaking up cash to avoid a CTR is structuring. A SAR would be appropriate."}, {"id": 148, "s": "3", "t": "AML", "q": "After filing a SAR, the firm should:", "c": ["Get the customer's signature", "Close the account immediately", "Notify the customer", "Never tell the customer"], "a": 3, "e": "Tipping off a customer about a SAR is prohibited."}, {"id": 149, "s": "3", "t": "AML", "q": "Broker-dealers must file a SAR for suspicious transactions involving at least:", "c": ["$10,000", "$25,000", "$5,000", "$2,000"], "a": 2, "e": "$5,000 or more, within 30 days."}, {"id": 150, "s": "3", "t": "Communications", "q": "A firm emails the same market commentary to 40 retail customers in a week. This is:", "c": ["Not a communication", "Correspondence", "A retail communication", "An institutional communication"], "a": 2, "e": "More than 25 retail investors within 30 days makes it a retail communication."}, {"id": 151, "s": "3", "t": "Communications", "q": "Retail communications generally require:", "c": ["Customer consent", "No review", "FINRA approval only", "Approval by a principal before use"], "a": 3, "e": "A qualified principal generally must approve retail communications before use."}, {"id": 152, "s": "3", "t": "Communications", "q": "A rep may make calls to prospects:", "c": ["Only on weekdays", "At any time if the prospect is on the do-not-call list", "Any time before 10 p.m. the rep's local time", "Between 8 a.m. and 9 p.m. the prospect's local time"], "a": 3, "e": "Telemarketing calls are limited to 8 a.m.-9 p.m. in the called party's time zone."}, {"id": 153, "s": "3", "t": "Privacy", "q": "Under Regulation S-P, customers can opt out of sharing their nonpublic personal information with:", "c": ["Affiliated companies only", "Nonaffiliated third parties", "The firm's employees", "Regulators"], "a": 1, "e": "Customers may opt out of sharing with nonaffiliated third parties."}, {"id": 154, "s": "3", "t": "SIPC", "q": "A customer has $400,000 in securities and $300,000 in cash in an individual account at a failed broker-dealer. SIPC covers up to:", "c": ["$500,000", "$700,000", "$650,000", "$250,000"], "a": 0, "e": "SIPC covers up to $500,000 per customer, but no more than $250,000 of it in cash: $400,000 securities + $100,000 of the cash = $500,000."}, {"id": 155, "s": "3", "t": "SIPC", "q": "SIPC protects customers against:", "c": ["Bank failures", "Bad investment advice", "The failure of a broker-dealer", "Market losses"], "a": 2, "e": "SIPC covers missing customer property when a member firm fails, not market losses."}, {"id": 156, "s": "3", "t": "Records", "q": "Order tickets and trade confirmations must be kept for at least:", "c": ["3 years", "6 years", "1 year", "The life of the firm"], "a": 0, "e": "3 years, easily accessible for the first 2."}, {"id": 157, "s": "4", "t": "Registration", "q": "Which person must register with FINRA?", "c": ["A receptionist who answers phones", "A person who solicits new brokerage accounts", "A cleaning crew member", "A clerk who files paperwork"], "a": 1, "e": "Anyone engaged in the securities business, including soliciting accounts, must register."}, {"id": 158, "s": "4", "t": "Registration", "q": "A firm must file Form U5 after a registered rep leaves within:", "c": ["15 days", "60 days", "10 days", "30 days"], "a": 3, "e": "Form U5 must be filed within 30 days of termination."}, {"id": 159, "s": "4", "t": "Registration", "q": "A rep moves to a new home address. Form U4 must be updated within:", "c": ["90 days", "60 days", "30 days", "10 days"], "a": 2, "e": "U4 amendments are due within 30 days of learning of the change. Events that could cause a statutory disqualification (like a felony conviction) must be reported within 10 days."}, {"id": 160, "s": "4", "t": "Registration", "q": "A person who passes the SIE has how long to associate with a firm and pass a top-off exam without retaking the SIE?", "c": ["2 years", "1 year", "Indefinitely", "4 years"], "a": 3, "e": "SIE results are valid for 4 years."}, {"id": 161, "s": "4", "t": "Registration", "q": "A rep left the industry. Without the Maintaining Qualifications Program, their qualifications generally expire after:", "c": ["1 year", "5 years", "10 years", "2 years"], "a": 3, "e": "Two years. MQP can extend this up to five years with annual CE."}, {"id": 162, "s": "4", "t": "Registration", "q": "Statutory disqualification can result from a felony conviction within the past:", "c": ["3 years", "10 years", "5 years", "7 years"], "a": 1, "e": "A felony conviction within 10 years is a statutory disqualification."}, {"id": 163, "s": "4", "t": "CE", "q": "The regulatory element of continuing education must be completed:", "c": ["Within 120 days of a registration anniversary", "Every 3 years", "By December 31 each year", "Only once"], "a": 2, "e": "Since 2023, the regulatory element is annual, due by December 31."}, {"id": 164, "s": "4", "t": "Arbitration", "q": "FINRA arbitration decisions are:", "c": ["Appealable to the NAC", "Advisory only", "Reviewed by a jury", "Final and binding with very limited appeal"], "a": 3, "e": "Arbitration awards are final and binding."}, {"id": 165, "s": "4", "t": "Arbitration", "q": "Simplified arbitration applies to claims of:", "c": ["$25,000 or less", "$1 million or less", "$50,000 or less", "$100,000 or less"], "a": 2, "e": "$50,000 or less may be decided by one arbitrator on documents."}, {"id": 166, "s": "4", "t": "Discipline", "q": "A FINRA disciplinary decision can be appealed first to the:", "c": ["National Adjudicatory Council", "Federal district court", "SEC", "MSRB"], "a": 0, "e": "NAC first, then the SEC, then federal court."}, {"id": 167, "s": "4", "t": "Supervision", "q": "A public website where investors can check a rep's background is:", "c": ["EMMA", "EDGAR", "BrokerCheck", "The CRD bulletin"], "a": 2, "e": "FINRA's BrokerCheck is free and public."}, {"id": 168, "s": "1", "t": "Underwriting", "q": "After an IPO, the managing underwriter may stabilize the price by bidding:", "c": ["Above the public offering price", "Only at the opening price", "At or below the public offering price", "At any price it chooses"], "a": 2, "e": "Stabilizing bids can never be above the public offering price."}, {"id": 169, "s": "1", "t": "Exempt", "q": "Which security is exempt from registration under the Securities Act of 1933?", "c": ["Closed-end fund shares", "Municipal bond", "Common stock of a bank holding company", "Variable annuity"], "a": 1, "e": "Munis, governments, bank securities, short-term commercial paper and nonprofit securities are exempt. Variable annuities and bank holding company stock are not."}, {"id": 170, "s": "1", "t": "Exempt", "q": "Under Rule 144A, restricted securities can be resold to:", "c": ["Non-accredited investors in the same state", "Any accredited investor", "Qualified institutional buyers", "The general public after 90 days"], "a": 2, "e": "Rule 144A allows resales to QIBs, generally institutions with $100 million or more in securities."}, {"id": 171, "s": "1", "t": "Fed", "q": "Which is a tool of fiscal policy rather than monetary policy?", "c": ["Changing reserve requirements", "Open market operations", "Changing the discount rate", "Changing tax rates"], "a": 3, "e": "Fiscal policy is taxes and government spending, set by Congress and the President. The others are Fed tools."}, {"id": 172, "s": "4", "t": "Registration", "q": "Form U4 asks for a registered person's employment history for the past:", "c": ["20 years", "3 years", "10 years", "5 years"], "a": 2, "e": "U4 covers 10 years of employment history and 5 years of residence history."}, {"id": 173, "s": "4", "t": "Reporting", "q": "Under FINRA Rule 4530, a firm must report a rep's felony conviction to FINRA within:", "c": ["10 calendar days", "90 calendar days", "15 calendar days", "30 calendar days"], "a": 3, "e": "Rule 4530 events are reported within 30 calendar days of the firm learning of them."}, {"id": 174, "s": "4", "t": "Ethics", "q": "Which FINRA rule requires members to observe high standards of commercial honor and just and equitable principles of trade?", "c": ["Rule 3110", "Rule 2010", "Rule 2111", "Rule 4512"], "a": 1, "e": "Rule 2010 is FINRA's catch-all ethics rule."}, {"id": 175, "s": "1", "t": "Offerings", "q": "Under SEC Rule 415, a shelf registration lets an issuer register securities now and sell them over a period of up to:", "c": ["1 year", "2 years", "5 years", "3 years"], "a": 3, "e": "Shelf registration covers sales over up to 3 years, so the issuer can sell when market conditions are good."}, {"id": 176, "s": "1", "t": "Disclosure", "q": "A public company's CEO resigns unexpectedly. The company reports this material event to the SEC on Form:", "c": ["S-1", "10-Q", "10-K", "8-K"], "a": 3, "e": "Form 8-K reports material events. The 10-K is the annual report and the 10-Q is the quarterly report. The S-1 registers an IPO."}, {"id": 177, "s": "1", "t": "Laws", "q": "The Trust Indenture Act of 1939 applies to:", "c": ["U.S. Treasury bonds", "Corporate bond offerings", "Common stock offerings", "Municipal bonds"], "a": 1, "e": "The act requires a trust indenture and independent trustee for corporate bond issues. Governments and munis are exempt."}, {"id": 178, "s": "1", "t": "Markets", "q": "Company founders sell 2 million of their own shares in a registered secondary offering. The proceeds go to:", "c": ["The SEC", "The founders", "The company", "The underwriters only"], "a": 1, "e": "In a secondary distribution, selling shareholders get the money, not the issuer."}, {"id": 179, "s": "1", "t": "Underwriting", "q": "The due diligence meeting for a new issue takes place:", "c": ["After the effective date", "After the stabilization period ends", "Before the registration statement is filed", "During the cooling-off period"], "a": 3, "e": "Issuer and underwriters review the offering's facts near the end of the cooling-off period, before the effective date."}, {"id": 180, "s": "1", "t": "Fed", "q": "If the Federal Reserve raises the reserve requirement, the likely result is:", "c": ["Lower bond yields", "Less money available to lend and higher rates", "More money available to lend", "Lower interest rates"], "a": 1, "e": "Banks must hold more in reserve, so they lend less. The money supply shrinks and rates tend to rise."}, {"id": 181, "s": "1", "t": "Economics", "q": "A persistent decline in the general level of prices is:", "c": ["Inflation", "Deflation", "Stagflation", "Recession"], "a": 1, "e": "Deflation is falling prices. Stagflation is high inflation combined with slow growth."}, {"id": 182, "s": "1", "t": "Markets", "q": "Institutional investors trading directly with each other through an electronic network, without a broker-dealer, is the:", "c": ["Second market", "Fourth market", "First market", "Third market"], "a": 1, "e": "The fourth market is direct institution-to-institution trading. The third market is OTC trading of exchange-listed securities."}, {"id": 183, "s": "2", "t": "Options", "q": "An investor buys an XYZ call and an XYZ put with the same strike price and expiration. The investor expects:", "c": ["The stock to stay flat", "The stock to rise sharply", "A big move in either direction", "The stock to fall sharply"], "a": 2, "e": "This is a long straddle. It profits from volatility in either direction and loses if the stock stays near the strike."}, {"id": 184, "s": "2", "t": "Options", "q": "XYZ is at $47. An XYZ 50 put has a premium of 4. The put's intrinsic value and time value are:", "c": ["$1 intrinsic, $3 time value", "$3 intrinsic, $1 time value", "$4 intrinsic, $0 time value", "$0 intrinsic, $4 time value"], "a": 1, "e": "The put is $3 in the money (50 - 47). The remaining $1 of the premium is time value."}, {"id": 185, "s": "2", "t": "Options", "q": "Most broad-based index options settle by:", "c": ["Delivery of all the stocks in the index", "Delivery of an ETF", "Delivery of futures contracts", "Cash"], "a": 3, "e": "Index options are cash-settled. Equity options settle by delivering shares."}, {"id": 186, "s": "2", "t": "Options", "q": "An American-style option can be exercised:", "c": ["Any time up to expiration", "Only by institutional investors", "Only on the expiration date", "Only in the last week before expiration"], "a": 0, "e": "American-style options can be exercised at any time before expiration. European-style options only at expiration."}, {"id": 187, "s": "2", "t": "Bonds", "q": "A customer buys a bond at a premium. Which yield is the highest?", "c": ["Current yield", "Yield to maturity", "Yield to call", "Nominal yield (coupon)"], "a": 3, "e": "For a premium bond: coupon > current yield > YTM > YTC."}, {"id": 188, "s": "2", "t": "Bonds", "q": "A bond's yield rises from 4.50% to 4.75%. This is an increase of:", "c": ["250 basis points", "2.5 basis points", "0.25 basis points", "25 basis points"], "a": 3, "e": "One basis point is 0.01%. A 0.25% change is 25 basis points."}, {"id": 189, "s": "2", "t": "Munis", "q": "A municipal bond backed by both project revenue and the issuer's taxing power is a:", "c": ["Industrial development bond", "Moral obligation bond", "Special tax bond", "Double-barreled bond"], "a": 3, "e": "Double-barreled bonds have two sources: revenue first, then the taxing power as backup."}, {"id": 190, "s": "2", "t": "Munis", "q": "A Puerto Rico general obligation bond bought by a New York resident pays interest that is:", "c": ["Fully taxable", "Exempt from federal tax only", "Taxable federally only", "Exempt from federal, state and local tax"], "a": 3, "e": "Bonds from U.S. territories are triple tax-exempt for investors in any state."}, {"id": 191, "s": "2", "t": "Munis", "q": "Interest on which municipal bonds may be subject to the alternative minimum tax (AMT)?", "c": ["Prerefunded bonds", "Bonds from U.S. territories", "General obligation bonds", "Private activity bonds"], "a": 3, "e": "Interest on certain private activity bonds is a tax preference item for the AMT."}, {"id": 192, "s": "2", "t": "Funds", "q": "A fund has $50 million in assets, $2 million in liabilities and 4 million shares outstanding. Its NAV per share is:", "c": ["$13.00", "$11.50", "$12.00", "$12.50"], "a": 2, "e": "($50 million - $2 million) / 4 million shares = $12.00."}, {"id": 193, "s": "2", "t": "Funds", "q": "A fund's NAV is $10.00 and its public offering price is $10.50. The sales charge as a percent of the offering price is about:", "c": ["0.50%", "4.76%", "5.25%", "5.00%"], "a": 1, "e": "Sales charge = ($10.50 - $10.00) / $10.50 = 4.76%. Sales charges are a percent of the offering price, not NAV."}, {"id": 194, "s": "2", "t": "Funds", "q": "An investor already owns $40,000 of a fund family's Class A shares and invests $15,000 more. The fund counts the existing holdings to reach the $50,000 breakpoint. This is:", "c": ["A letter of intent", "Rights of accumulation", "A 1035 exchange", "Breakpoint selling"], "a": 1, "e": "Rights of accumulation count existing holdings toward breakpoints on new purchases."}, {"id": 195, "s": "2", "t": "Annuities", "q": "A variable annuity's separate account is registered under the Investment Company Act of 1940 because:", "c": ["It is insured by the FDIC", "It is a bank product", "It invests in securities and the investor bears the investment risk", "It guarantees a fixed rate"], "a": 2, "e": "The separate account holds securities and the investor takes the risk, so it is regulated as an investment company."}, {"id": 196, "s": "2", "t": "Annuities", "q": "A customer wants to cash out a variable annuity bought two years ago. The customer is most likely to pay:", "c": ["A surrender charge", "No fees of any kind", "A 12b-1 fee refund", "A front-end load"], "a": 0, "e": "Most annuities charge declining surrender fees for withdrawals in the early years."}, {"id": 197, "s": "2", "t": "Retirement", "q": "Which account has no required minimum distributions for the original owner?", "c": ["SEP-IRA", "Traditional IRA", "401(k)", "Roth IRA"], "a": 3, "e": "Roth IRAs have no RMDs during the original owner's lifetime."}, {"id": 198, "s": "2", "t": "Retirement", "q": "A 40-year-old withdraws $10,000 from a traditional IRA to buy a first home. The withdrawal is:", "c": ["Taxable but not subject to the 10% penalty", "Subjec function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- stats ----------
function stats() { return store.get('stats', {}); }   // id -> {r: right count, w: wrong count, last: bool}
function record(id, right) {
  const st = stats(); const x = st[id] || {r: 0, w: 0};
  right ? x.r++ : x.w++; x.last = right; st[id] = x; store.set('stats', st);
}
function missedIds() { const st = stats(); return Object.keys(st).filter(k => st[k].last === false).map(Number); }

// ---------- start runs ----------
function start(kind, opts = {}) {
  let ids, mode = 'practice', title, timed = false;
  if (kind === 'A' || kind === 'B') { ids = DATA['exam' + kind]; mode = 'exam'; timed = true; title = 'Practice Exam ' + kind; }
  else if (kind === 'random') {
    ids = []; for (const s in W) ids.push(...shuffle(DATA.questions.filter(q => q.s === s).map(q => q.id)).slice(0, W[s]));
    ids = shuffle(ids); mode = 'exam'; timed = true; title = 'Random Full Exam';
  }
  if (mode === 'exam' && opts.learn) { mode = 'practice'; timed = false; title += ' (Learn)'; }
  else if (kind === 'quick') { ids = shuffle(DATA.questions.map(q => q.id)).slice(0, opts.n || 10); title = 'Quick Quiz'; }
  else if (kind === 'section') { ids = shuffle(DATA.questions.filter(q => q.s === opts.s).map(q => q.id)).slice(0, 20); title = 'Section ' + opts.s + ' Drill'; }
  else if (kind === 'missed') { ids = shuffle(missedIds()); title = 'Missed Questions'; if (!ids.length) return; }
  S = {title, mode, timed, ids, ans: {}, flags: {}, i: 0, started: Date.now(), elapsed: 0, resumedAt: null, limit: timed ? 105 * 60 : 0, done: false, shown: {}};
  save(); render();
}

function confirmStart(k) {

}
function examMode() { return store.get('examMode', 'official'); }
function setExamMode(m) { store.set('examMode', m); home(); }

// The exam clock only runs while an exam question is on screen and the app is visible.
let view = 'home';
function usedMs() { return (S.elapsed || 0) + (S.resumedAt ? Date.now() - S.resumedAt : 0); }
function timeLeft() { return Math.max(0, S.limit - Math.floor(usedMs() / 1000)); }
function pauseClock() { if (S && S.resumedAt) { S.elapsed = usedMs(); S.resumedAt = null; save(); } }
function resumeClock() { if (S && !S.done && S.timed && !S.resumedAt && view === 'question' && document.visibilityState === 'visible') { S.resumedAt = Date.now(); save(); } }
function fmt(t) { const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(s).padStart(2, '0'); }

function question() {
  view = 'question'; resumeClock();
  const id = S.ids[S.i], q = Q[id], chosen = S.ans[id];
  const reveal = S.mode === 'practice' && chosen !== undefined;
  const pending = S.mode === 'practice' && !reveal ? S.pending : undefined;
  const answered = Object.keys(S.ans).length;

    <div class="bar"><i style="width:${answered / S.ids.length * 100}%"></i></div></div>`;
  h += `<span class="pill">Section ${q.s} · ${esc(q.t)}</span><p class="q">${esc(q.q)}</p>`;
  q.c.forEach((c, j) => {
    let cls = '';
    if (reveal) { if (j === q.a) cls = 'ok'; else if (j === chosen) cls = 'bad'; }
    else if (j === chosen || j === pending) cls = 'sel';
    h += `<button class="ch ${cls}" onclick="pick(${j})"><span class="k">${L[j]}</span><span>${esc(c)}</span></button>`;
  });
  if (reveal) h += `<div class="exp"><b class="${chosen === q.a ? 'ok' : 'bad'}">${chosen === q.a ? 'Correct.' : 'Not quite. The answer is ' + L[q.a] + '.'}</b> ${esc(q.e)}</div>`;
  if (S.mode === 'practice' && S.ids.length > 25) {
    h += `<h2>Jump to question</h2><div class="grid">` + S.ids.map((x, k) => `<button class="${S.ans[x] === undefined ? '' : S.ans[x] === Q[x].a ? 'ok' : 'bad'} ${k === S.i ? 'cur' : ''}" onclick="go(${k})">${k + 1}</button>`).join('') + `</div>
    <p class="meta">${answered} checked · ${S.ids.filter(x => S.ans[x] !== undefined && S.ans[x] === Q[x].a).length} right</p>`;

    <p class="meta">${answered} answered · ${Object.values(S.flags).filter(Boolean).length} flagged</p>
    <button class="btn" style="margin-top:14px" onclick="submit()"><b>Submit exam</b><span>${S.ids.length - answered} unanswered</span></button>`;
  }

    (S.mode === 'practice' && !reveal ? `<button class="go" onclick="check()" ${pending === undefined ? 'disabled' : ''}>Check answer</button>` :
    last ? `<button class="go" onclick="submit()">${S.mode === 'exam' ? 'Submit' : 'Finish'}</button>` : `<button class="go" onclick="go(S.i+1)">Next</button>`);
}

function check() {
  const id = S.ids[S.i];
  if (S.pending === undefined || S.ans[id] !== undefined) return;
  S.ans[id] = S.pending; S.pending = undefined; record(id, S.ans[id] === Q[id].a); save(); question();
}
function go(k) { if (k < 0 || k >= S.ids.length) return; S.i = k; S.pending = undefined; save(); question(); window.scrollTo(0, 0); }
function flag() { const id = S.ids[S.i]; S.flags[id] = !S.flags[id]; save(); question(); }
function goHome() { home(); }
function submit(force) {
  const left = S.ids.filter(id => S.ans[id] === undefined).length;
  if (!force && S.mode === 'exam' && left && !confirm(left + ' unanswered. Submit anyway?')) return;
  if (S.mode === 'exam') S.ids.forEach(id => { if (S.ans[id] !== undefined) record(id, S.ans[id] === Q[id].a); else record(id, false); });
  pauseClock(); S.done = true; S.finished = Date.now();
  const right = S.ids.filter(id => S.ans[id] === Q[id].a).length, pct = Math.round(right / S.ids.length * 100);
  if (S.mode === 'exam') { const hist = store.get('history', []); hist.push({title: S.title, pct, at: Date.now()}); store.set('history', hist); }
  save(); results();
}
function results() {
  view = 'results';
  $('#nav').classList.add('hide');
  const right = S.ids.filter(id => S.ans[id] === Q[id].a).length, pct = Math.round(right / S.ids.length * 100);
  let h = `<div class="top"><button class="link" onclick="goHome()">‹ Menu</button></div>
  <p class="sub">${esc(S.title)}</p><div class="big ${pct >= 70 ? 'pass' : 'fail'}">${pct}%</div>
  <p>${right} of ${S.ids.length} correct${S.mode === 'exam' ? (pct >= 70 ? ' · <b class="pass">Pass</b>' : ' · <b class="fail">Below 70</b>') : ''}${S.timed ? ' · ' + fmt(Math.floor((S.elapsed || 0) / 1000)) + ' used' : ''}</p>`;
  h += `<div class="card">`;
  for (const s in SEC) {
    const ids = S.ids.filter(id => Q[id].s === s); if (!ids.length) continue;
    const r = ids.filter(id => S.ans[id] === Q[id].a).length;
    h += `<div class="sec"><span>${s}. ${esc(SEC[s])}</span><span>${r}/${ids.length}</span></div>`;
  }
  h += `</div><div class="row"><button class="btn" onclick="filterReview(false)"><b>Review misses</b></button><button class="btn" onclick="filterReview(true)"><b>Review all</b></button></div><div id="rev"></div>`;
  $('#app').innerHTML = h; window.scrollTo(0, 0); filterReview(false);
}
function filterReview(all) {
  const ids = S.ids.filter(id => all || S.ans[id] !== Q[id].a);
  $('#rev').innerHTML = ids.length ? ids.map(id => {
    const q = Q[id], c = S.ans[id], ok = c === q.a, n = S.ids.indexOf(id) + 1;
    return `<div class="card"><span class="pill">${n} · Section ${q.s} · ${esc(q.t)}</span><p style="margin:10px 0">${esc(q.q)}</p>
    ${c !== undefined && !ok ? `<p class="meta" style="color:var(--bad)">Your answer: ${L[c]}. ${esc(q.c[c])}</p>` : ''}${c === undefined ? `<p class="meta" style="color:var(--bad)">Not answered</p>` : ''}
    <p style="color:var(--ok);margin:4px 0"><b>${L[q.a]}. ${esc(q.c[q.a])}</b></p><p class="meta" style="font-size:15px;color:var(--text)">${esc(q.e)}</p></div>`;
  }).join('') : '<p>No misses. Nice work.</p>';
}
function render() { if (!S) return home(); if (S.done) return results(); question(); }

setInterval(() => {
  if (S && !S.done && S.timed && S.resumedAt) {
    S.elapsed = usedMs(); S.resumedAt = Date.now(); save();  // checkpoint, so a closed app loses at most a second
    const t = timeLeft(); if ($('#clock')) $('#clock').textContent = fmt(t);
    if (t === 0) { alert("Time's up. Your exam will be scored now."); submit(true); }
  }
}, 1000);
if (S && S.resumedAt) { S.resumedAt = null; save(); }  // app was closed mid-exam: don't count the time away
if (S && S.elapsed === undefined) { S.elapsed = 0; save(); }
document.addEventListener('visibilitychange', () => { document.visibilityState === 'visible' ? resumeClock() : pauseClock(); });
window.addEventListener('pagehide', pauseClock);
home();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
